<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palette &amp; Triage — Unseen Local Forms</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: Canvas;
      color: CanvasText;
      line-height: 1.45;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    section {
      padding: 18px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 10px;
      display: grid;
      gap: 14px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
    }
    form {
      display: grid;
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 13px;
    }
    label.inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input, select, button {
      font: inherit;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Field;
      color: FieldText;
    }
    button {
      justify-self: start;
      cursor: pointer;
      font-weight: 600;
      background: ButtonFace;
      color: ButtonText;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      padding: 6px 8px;
      text-align: left;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="page-title">Unseen Local Forms Workspace</h1>
      <div class="badge" data-testid="stray-banner" tabindex="0">Reference Note: Local Only</div>
    </header>

    <section>
      <h2>1. Hex Swatch Entry (Tab Form)</h2>
      <form id="tab-form" data-testid="tab-form">
        <div class="grid-3">
          <label for="hex-code">
            <span>Hex Code</span>
            <input id="hex-code" name="hex_code" type="text" data-testid="hex-code" placeholder="#1a2b3c" required />
          </label>
          <label for="hex-label">
            <span>Hex Label</span>
            <input id="hex-label" name="hex_label" type="text" data-testid="hex-label" placeholder="Coral" required />
          </label>
          <label for="hex-note">
            <span>Hex Note</span>
            <input id="hex-note" name="hex_note" type="text" data-testid="hex-note" placeholder="Primary accent" required />
          </label>
        </div>
        <button type="submit" id="tab-submit-btn" data-testid="tab-submit-btn">Save Swatch</button>
      </form>
      <table>
        <thead>
          <tr><th>Hex Code</th><th>Hex Label</th><th>Hex Note</th></tr>
        </thead>
        <tbody id="tab-submissions" data-testid="tab-submissions"></tbody>
      </table>
    </section>

    <section>
      <h2>2. Quick Dispatch (Select + Checkbox + Enter)</h2>
      <form id="combo-form" data-testid="combo-form">
        <label for="combo-select">
          <span>Route Tier</span>
          <select id="combo-select" name="combo_select" data-testid="combo-select">
            <option value="standard">Standard</option>
            <option value="express">Express</option>
            <option value="priority">Priority</option>
          </select>
        </label>
        <label class="inline" for="combo-check">
          <input id="combo-check" name="combo_check" type="checkbox" data-testid="combo-check" />
          <span>Notify recipient</span>
        </label>
        <label for="combo-enter">
          <span>Dispatch Note (Press Enter)</span>
          <input id="combo-enter" name="combo_enter" type="text" data-testid="combo-enter" placeholder="Type note and press Enter" required />
        </label>
      </form>
      <ul id="combo-submissions" data-testid="combo-submissions"></ul>
    </section>
  </main>

  <script>
    const tabForm = document.getElementById("tab-form");
    const hexCode = document.getElementById("hex-code");
    const hexLabel = document.getElementById("hex-label");
    const hexNote = document.getElementById("hex-note");
    const tabSubmissions = document.getElementById("tab-submissions");

    tabForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const row = document.createElement("tr");
      row.setAttribute("data-testid", "tab-submission-row");
      for (const val of [hexCode.value.trim(), hexLabel.value.trim(), hexNote.value.trim()]) {
        const td = document.createElement("td");
        td.textContent = val;
        row.appendChild(td);
      }
      tabSubmissions.appendChild(row);
      tabForm.reset();
    });

    const comboForm = document.getElementById("combo-form");
    const comboSelect = document.getElementById("combo-select");
    const comboCheck = document.getElementById("combo-check");
    const comboEnter = document.getElementById("combo-enter");
    const comboSubmissions = document.getElementById("combo-submissions");

    comboForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const li = document.createElement("li");
      li.setAttribute("data-testid", "combo-submission-row");
      li.dataset.select = comboSelect.value;
      li.dataset.checked = String(comboCheck.checked);
      li.dataset.note = comboEnter.value.trim();
      li.textContent = `${comboSelect.value} | checked=${String(comboCheck.checked)} | ${comboEnter.value.trim()}`;
      comboSubmissions.appendChild(li);
      comboForm.reset();
    });
  </script>
</body>
</html>
