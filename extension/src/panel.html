<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eyes</title>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("./fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --bg: #0a0a0b;
      --surface: #121214;
      --surface-hover: #18181b;
      --ink: #fafafa;
      --ink-2: #a1a1aa;
      --ink-3: #71717a;
      --line: #222226;
      --line-strong: #323238;
      --signal: #f59e0b;
      --signal-dim: rgba(245, 158, 11, 0.12);
      --ok: #22c55e;
      --waste: #71717a;
      --danger: #ef4444;
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    header.top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand svg {
      color: var(--ink);
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 11px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
    }
    main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .intro h1 {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .intro p {
      margin: 0;
      color: var(--ink-3);
      font-size: 12px;
    }

    /* Time Ledger Meter */
    .meter-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .meter-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .meter-hero {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .meter-hero-val {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1;
    }
    .meter-hero-lbl {
      font-size: 12px;
      color: var(--ink-3);
    }
    .meter-counts {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .meter-counts strong {
      color: var(--ink-2);
      font-weight: 600;
    }
    .meter-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meter-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--ink-2);
    }
    .meter-row-val {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      color: var(--ink-2);
    }
    .meter-row-val.reclaimed {
      color: var(--ok);
    }
    .meter-track {
      height: 4px;
      width: 100%;
      border-radius: 2px;
      background: #1c1c20;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 220ms ease;
    }
    .meter-fill.manual {
      background: var(--waste);
    }
    .meter-fill.reclaimed {
      background: var(--ok);
    }
    .meter-note {
      font-size: 11px;
      color: var(--ink-3);
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .filter-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 2px 8px;
      border: 0;
      background: transparent;
      color: var(--ink-3);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: color 120ms ease;
    }
    .filter-tab:hover {
      color: var(--ink-2);
    }
    .filter-tab.active {
      color: var(--ink);
    }
    .filter-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1.5px;
      background: var(--ink);
    }
    .tab-count {
      font-family: var(--mono);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }
    .search-input::placeholder {
      color: var(--ink-3);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--line-strong);
    }

    /* Optimization List */
    .library-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      transition: border-color 120ms ease;
    }
    .opt-card:hover {
      border-color: var(--line-strong);
    }
    .opt-card.paused {
      opacity: 0.55;
    }
    .opt-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .opt-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 3px;
    }
    .opt-title {
      margin: 0 0 2px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.3;
      color: var(--ink);
    }
    .opt-desc {
      margin: 0;
      font-size: 12px;
      color: var(--ink-2);
    }
    .switch {
      flex: 0 0 auto;
      position: relative;
      width: 30px;
      height: 18px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--bg);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ink-3);
      transition: transform 120ms ease, background 120ms ease;
    }
    .switch[aria-checked="true"] {
      background: var(--ink);
      border-color: var(--ink);
    }
    .switch[aria-checked="true"]::after {
      transform: translateX(12px);
      background: var(--bg);
    }
    .suggested-tag {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--signal);
    }
    .preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .preview-snippet {
      flex: 1 1 180px;
      padding: 7px 9px;
      border-left: 2px solid var(--line-strong);
      background: var(--bg);
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
    }
    .keycap {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 10.5px;
    }
    .opt-stats-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
    }
    .opt-stats-line strong {
      color: var(--ink-2);
      font-weight: 500;
    }
    .opt-stats-line .saved {
      color: var(--ok);
    }

    /* Flat Flow Comparison Strip */
    .dag-canvas {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .dag-canvas[hidden] {
      display: none;
    }
    .flow-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .flow-head-eyes {
      color: var(--signal);
    }
    .flow-sub {
      text-transform: none;
      letter-spacing: 0;
    }
    .flow-track {
      display: flex;
      align-items: stretch;
      gap: 4px;
    }
    .flow-node {
      flex: 1 1 0;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--bg);
    }
    .flow-node.eyes-step {
      border-color: rgba(245, 158, 11, 0.35);
      background: var(--signal-dim);
    }
    .flow-node.loop {
      border-style: dashed;
    }
    .flow-kind {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 2px;
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 9.5px;
    }
    .flow-node.eyes-step .flow-kind {
      color: var(--signal);
    }
    .flow-node.done .flow-kind {
      color: var(--ok);
    }
    .flow-label {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      color: var(--ink-2);
      font-size: 10.5px;
      line-height: 1.25;
    }
    .flow-arrow {
      flex: 0 0 auto;
      align-self: center;
      color: var(--ink-3);
    }
    .dag-divider {
      display: none;
    }

    .opt-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .opt-meta {
      color: var(--ink-3);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .opt-meta.ok {
      color: var(--ok);
    }
    .opt-meta.err {
      color: var(--danger);
    }
    .opt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    button.btn {
      border-radius: 5px;
      font: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      padding: 5px 10px;
      transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
    }
    button.btn.primary {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }
    button.btn.primary:hover {
      background: #e4e4e7;
    }
    button.btn.ghost {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink-2);
    }
    button.btn.ghost:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
    .empty-state {
      padding: 24px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      text-align: center;
      color: var(--ink-3);
      font-size: 12px;
    }
    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: var(--ink-2);
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg data-eyes-brand-mark viewBox="0 0 20 20" width="15" height="15" fill="none" aria-hidden="true">
        <path d="M2 10c2.2-3.6 5-5.4 8-5.4s5.8 1.8 8 5.4c-2.2 3.6-5 5.4-8 5.4S4.2 13.6 2 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="10" cy="10" r="2.3" fill="currentColor"/>
      </svg>
      <span class="product">Eyes</span>
    </div>
    <span class="status-indicator" aria-label="Eyes is watching for repeated workflows">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Watching</span>
    </span>
  </header>

  <main>
    <div class="intro">
      <h1>Optimization Library</h1>
      <p>Repeated workflows captured from your browser.</p>
    </div>

    <section class="meter-card" aria-label="Time reclaimed meter">
      <div class="meter-top">
        <div class="meter-hero">
          <span class="meter-hero-val" id="sum-saved">0s</span>
          <span class="meter-hero-lbl">reclaimed</span>
        </div>
        <div class="meter-counts">
          <span><strong id="sum-runs">0</strong> runs</span>
          <span><strong id="sum-active">0</strong> active</span>
        </div>
      </div>

      <div class="meter-bars">
        <div class="meter-row">
          <div class="meter-row-head">
            <span>Spent manually (observed)</span>
            <span class="meter-row-val" id="meter-manual-val">0s</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill manual" id="meter-manual-bar" style="width: 0%;"></div>
          </div>
        </div>
        <div class="meter-row">
          <div class="meter-row-head">
            <span>Reclaimed via Eyes</span>
            <span class="meter-row-val reclaimed" id="meter-reclaimed-val">0s</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill reclaimed" id="meter-reclaimed-bar" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <div class="meter-note" id="meter-note">Run an automation to reclaim manual time</div>
    </section>

    <div class="controls">
      <div class="filter-bar" role="tablist" aria-label="Filter optimizations">
        <button class="filter-tab active" type="button" role="tab" aria-selected="true" data-filter="all">
          <span>All</span>
          <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="active">
          <span>Active</span>
          <span class="tab-count" id="count-active">0</span>
        </button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="suggested">
          <span>Suggested</span>
          <span class="tab-count" id="count-suggested">0</span>
        </button>
      </div>
      <input
        class="search-input"
        id="library-search"
        type="search"
        placeholder="Filter workflows..."
        aria-label="Search optimizations"
      />
    </div>

    <section class="library-list" id="library-list" aria-label="Saved optimizations"></section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
